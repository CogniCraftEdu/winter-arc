<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CogniGuru – Your AI tutor. Your way of learning.</title>
<style>
  @font-face{font-family:NSerif;font-weight:700;src:url(assets/fonts/noto-serif-latin-700-normal.woff2)}
  @font-face{font-family:NSans;font-weight:400;src:url(assets/fonts/noto-sans-latin-400-normal.woff2)}
  @font-face{font-family:NSans;font-weight:600;src:url(assets/fonts/noto-sans-latin-600-normal.woff2)}
  :root{--cream:#f5efe8;--green:#1a3b34;--teal:#0f7b6c;--terra:#c4663a;--ink:#1b2b27;--mute:#6f7a76}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:NSans,Inter,"Segoe UI",sans-serif;background:var(--cream);color:var(--ink)}
  header{background:var(--green);padding:18px 32px;display:flex;align-items:center;gap:14px}
  header img{height:40px}
  header span{color:var(--cream);font-weight:600;font-size:22px}
  header em{margin-left:auto;font-style:normal;background:var(--terra);color:#fff;font-weight:600;font-size:15px;padding:7px 18px;border-radius:30px}
  .hero{max-width:1180px;margin:0 auto;padding:48px 24px 24px}
  h1{font-family:NSerif,Georgia,serif;font-size:clamp(34px,5vw,60px);line-height:1.1;letter-spacing:-1px;color:var(--green);text-align:center}
  h1 em{font-style:normal;color:var(--teal)}
  p.lead{text-align:center;color:var(--mute);font-size:19px;margin:16px auto 28px;max-width:640px;line-height:1.5}
  .video{border-radius:24px;overflow:hidden;box-shadow:0 30px 90px rgba(26,59,52,.25);background:#000;line-height:0}
  video{width:100%;aspect-ratio:16/9;display:block}
  form{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:34px auto 0;max-width:560px}
  input[type=email]{flex:1 1 280px;padding:17px 22px;border-radius:40px;border:2px solid #d9d0c3;background:#fff;font-size:17px;font-family:inherit;color:var(--ink)}
  input[type=email]:focus{outline:none;border-color:var(--teal)}
  button{padding:17px 34px;border-radius:40px;border:0;font-size:17px;font-weight:600;font-family:inherit;color:#fff;background:var(--green);cursor:pointer;box-shadow:0 12px 30px rgba(26,59,52,.28)}
  button:disabled{opacity:.6;cursor:default}
  #msg{text-align:center;margin-top:14px;min-height:24px;font-size:16px;color:var(--teal)}
  #msg.err{color:#b3261e}
  small{display:block;text-align:center;color:var(--mute);margin:8px 0 56px}
</style>
</head>
<body>
<header><img src="assets/logo-mark-white.png" alt=""><span>CogniGuru</span><em>AI Tutor</em></header>
<main class="hero">
  <h1>Same concept.<br><em>Different explanation.</em></h1>
  <p class="lead">An AI tutor that explains it your way, in your language, until it finally clicks. Built for CBSE, ICSE &amp; IB students.</p>
  <div class="video">
    <video src="cogniguru-film.mp4" poster="film-poster.jpg" controls playsinline preload="metadata"></video>
  </div>
  <form id="f">
    <input type="email" id="email" placeholder="you@email.com" required autocomplete="email" aria-label="Email address">
    <button id="b" type="submit">Join the waitlist</button>
  </form>
  <div id="msg" role="status"></div>
  <small>cognicraftedu.com</small>
</main>
<script>
  // Point this at your form backend (Formspree, Google Apps Script, Supabase, ...).
  // It receives a JSON POST: { "email": "..." }. While empty, signups are only stored in this browser.
  const WAITLIST_ENDPOINT = '';
  const f = document.getElementById('f'), msg = document.getElementById('msg'), b = document.getElementById('b');
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    b.disabled = true; msg.className = ''; msg.textContent = '';
    try {
      if (WAITLIST_ENDPOINT) {
        const r = await fetch(WAITLIST_ENDPOINT, {method:'POST', headers:{'Content-Type':'application/json',Accept:'application/json'}, body:JSON.stringify({email})});
        if (!r.ok) throw new Error('bad status');
      } else {
        const list = JSON.parse(localStorage.getItem('waitlist') || '[]'); list.push(email);
        localStorage.setItem('waitlist', JSON.stringify(list));
      }
      msg.textContent = "You're on the list. We'll email you when it's ready.";
      f.reset();
    } catch (err) {
      msg.className = 'err'; msg.textContent = 'Something went wrong. Please try again.';
    }
    b.disabled = false;
  });
</script>
</body>
</html>
